; ESP32-C6 GPS Tracker/Logger
; PlatformIO project configuration
;
; ESP32-C6 (RISC-V, Arduino core 3.x) is not fully supported on the
; official PlatformIO "espressif32" registry platform yet. We use the
; community "pioarduino" fork instead, which tracks current Arduino-ESP32
; releases and ships a build script compatible with them. Do NOT mix this
; with `platform = espressif32` + a manually pinned framework package -
; that combination fails with an error like:
;   *** missing SConscript file '.../framework-arduinoespressif32/tools/pioarduino-build.py'
; because the official platform's builder doesn't know how to invoke the
; pioarduino-flavored framework package's build script.

[env:esp32-c6-devkitm-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
; If the URL above hangs/stalls (some networks block GitHub's release CDN,
; objects.githubusercontent.com, even when github.com itself is reachable),
; download the zip manually via a browser and point at the local file
; instead, e.g.:
;   platform = file:///home/you/Downloads/platform-espressif32.zip
; board = seeed_xiao_esp32c6 (not the generic esp32-c6-devkitm-1) - the
; XIAO-specific board definition carries defaults tuned for this exact
; board rather than a generic Espressif devkit, and is confirmed working
; on this pinned platform release.
board = seeed_xiao_esp32c6
framework = arduino

monitor_speed = 115200
upload_speed = 921600
; Native USB CDC boards (no separate USB-UART bridge chip) don't need, and
; can be confused by, the monitor asserting DTR/RTS on connect the way a
; classic UART-bridge board would - keep both deasserted.
monitor_dtr = 0
monitor_rts = 0
; If autodetect picks the wrong port or can't find it (common on native-USB
; boards like the XIAO after a crash/reset), uncomment and set explicitly -
; check `ls /dev/cu.*` (macOS) or `ls /dev/ttyACM*` (Linux) for the exact name:
; upload_port = /dev/cu.usbmodemXXXX
; monitor_port = /dev/cu.usbmodemXXXX
board_build.filesystem = littlefs
board_build.partitions = partitions.csv

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ARDUHAL_LOG_COLORS=1
    -D GPS_BAUD=9600
    -D GPS_RX_PIN=20
    -D GPS_TX_PIN=18
    -D GPS_POWER_PIN=23
    -D BATTERY_ADC_PIN=1
    -D ADXL_SDA_PIN=17
    -D ADXL_SCL_PIN=19
    -D ADXL_INT_PIN=2
    -D CHARGE_STATUS_PIN=0
    -D BUZZER_PIN=22
    -D FW_VERSION=\"1.0.0\"
    ; Diagnostic only - add this temporarily if the device crash-loops with
    ; ZERO serial output (no boot banner, no ROM bootloader lines at all)
    ; even after a full chip erase + reflash. That symptom matches a
    ; brownout reset happening before any code can run. If adding this
    ; line lets it boot normally, that CONFIRMS brownout as the cause -
    ; remove this again afterward and address the actual power/current
    ; issue instead (see the troubleshooting note in README.md); this
    ; disables real flash-corruption protection and isn't safe to ship.
    ; -D DISABLE_BROWNOUT_DETECTOR=1

lib_deps =
    mikalhart/TinyGPSPlus @ ^1.0.3
    bblanchon/ArduinoJson @ ^7.1.0
    https://github.com/tzapu/WiFiManager.git#master

monitor_filters = esp32_exception_decoder, time

; Dev/bench build: identical to the main env, but disables deep sleep
; entirely (see DISABLE_DEEP_SLEEP in main.cpp). Useful while actively
; developing over USB - the XIAO's native USB CDC fully resets on every
; deep-sleep wake (inherent to the chip, not a bug), so if the board sits
; motionless on your desk it'll normally sleep after 15 min and the serial
; port will drop/reappear on every wake cycle after that. This env keeps
; the port stable for continuous debugging. Use the real env for anything
; battery-powered/field-deployed.
;   pio run -e esp32-c6-devkitm-1-dev -t upload
; [env:esp32-c6-devkitm-1-dev]
; extends = env:esp32-c6-devkitm-1
; build_flags =
;     ${env:esp32-c6-devkitm-1.build_flags}
;     -D DISABLE_DEEP_SLEEP=1
;     -D GPS_DEBUG_RAW_NMEA=1
;     -D MOTION_DEBUG_RAW=1   ; ADXL noise-floor logging ("peak sample delta"), for threshold tuning
